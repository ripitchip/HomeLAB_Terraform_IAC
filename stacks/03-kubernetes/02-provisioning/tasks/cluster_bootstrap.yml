# tasks/cluster_bootstrap.yml

- name: Add Local Nexus Helm repositories
  ansible.builtin.shell: |
    helm repo add argo https://registry.foobarbaz.lan/repository/helm-argo/ --force-update --insecure-skip-tls-verify
    helm repo add hashicorp https://registry.foobarbaz.lan/repository/helm-hashicorp/ --force-update --insecure-skip-tls-verify
    helm repo add traefik https://registry.foobarbaz.lan/repository/helm-traefik/ --force-update --insecure-skip-tls-verify
    helm repo update
  changed_when: false

- name: Configure CoreDNS to forward to Stack 01 DNS
  ansible.builtin.shell:
    cmd: |
      kubectl get configmap coredns -n kube-system -o yaml | \
      sed 's/forward . \/etc\/resolv.conf/forward . {{ dns_stack_01 }}/' | \
      kubectl apply -f -
  register: coredns_patch
  changed_when: false

- name: Restart CoreDNS to apply DNS forwarding
  ansible.builtin.command: kubectl rollout restart deployment coredns -n kube-system
  when: coredns_patch is succeeded

- name: Deploy ArgoCD via Nexus
  ansible.builtin.command: >-
    helm upgrade --install argocd argo/argo-cd
    --namespace argocd --create-namespace
    --set server.service.type=ClusterIP
    --insecure-skip-tls-verify
  changed_when: false

- name: Deploy Traefik (API Gateway) via Nexus
  ansible.builtin.command: >-
    helm upgrade --install traefik traefik/traefik
    --namespace traefik --create-namespace
    --set service.type=NodePort
    --insecure-skip-tls-verify
  changed_when: false

- name: Deploy Vault Agent Injector via Nexus
  ansible.builtin.command: >-
    helm upgrade --install vault hashicorp/vault
    --namespace vault --create-namespace
    --set "injector.externalVaultAddr={{ vault_url }}"
    --insecure-skip-tls-verify
  changed_when: false
